    <script>
      (function () {
        try {
          var isAuthLike = /^\/(auth|forgot-password|reset-password|verify-email)(\/|$)/.test(location.pathname);
          var topColor = isAuthLike ? '#DDFED7' : '#F5F1EB';
          document.documentElement.style.colorScheme = 'light';
          document.documentElement.style.setProperty('--app-top-bg', topColor);
          document.documentElement.style.backgroundColor = topColor;
          var theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.setAttribute('content', topColor);
          var colorScheme = document.querySelector('meta[name="color-scheme"]');
          if (colorScheme) colorScheme.setAttribute('content', 'light');
          var appleStatus = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (appleStatus) appleStatus.setAttribute('content', 'default');
        } catch (e) {}
      })();

    </script>
