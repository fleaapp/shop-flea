    <script>
      (function () {
        try {
          var pathname = location.pathname;
          var isAuthLike = /^\/(auth|forgot-password|reset-password|verify-email)(\/|$)/.test(pathname);
          var cap = window.Capacitor;
          var isNative = (cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform()) || location.protocol === 'capacitor:';
          var hasAuthToken = false;
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1) { hasAuthToken = true; break; }
            }
          } catch (e) {}
          var nativeLoggedOutAtRoot = isNative && !hasAuthToken && (pathname === '/' || pathname === '');
          var paintLime = isAuthLike || nativeLoggedOutAtRoot;
          var topColor = paintLime ? '#DDFED7' : '#F5F1EB';
          document.documentElement.style.colorScheme = 'light';
          document.documentElement.style.setProperty('--app-top-bg', topColor);
          document.documentElement.style.backgroundColor = topColor;
          if (paintLime) {
            // Override --background so #root (which uses hsl(var(--background))) also paints lime
            // before React mounts. Cleared by appChrome once a non-auth route activates.
            document.documentElement.style.setProperty('--background', '111 95% 92%');
            document.documentElement.classList.add('boot-auth');
          }
          var theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.setAttribute('content', topColor);
          var colorScheme = document.querySelector('meta[name="color-scheme"]');
          if (colorScheme) colorScheme.setAttribute('content', 'light');
          var appleStatus = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (appleStatus) appleStatus.setAttribute('content', 'default');
        } catch (e) {}
      })();


    </script>

  <body>
    <div id="root"></div>
    <script>
      // Boot watchdog: if React has not mounted anything into #root a few
      // seconds after load, the bundle failed to evaluate. Show a readable
      // message with the underlying error instead of a silent blank screen.
      (function () {
        var firstError = null;
        window.addEventListener('error', function (event) {
          if (!firstError) firstError = (event && event.message) || 'Unknown script error';
        });
        window.addEventListener('unhandledrejection', function (event) {
          if (!firstError) {
            var reason = event && event.reason;
            firstError = (reason && (reason.message || String(reason))) || 'Unhandled promise rejection';
          }
        });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px;text-align:center;font-family:Inter,-apple-system,system-ui,sans-serif;color:#2b2b2b">' +
            '<div style="font-size:34px">🧺</div>' +
            '<div style="font-size:17px;font-weight:700">Flea could not start</div>' +
            '<div style="font-size:14px;opacity:.75;max-width:280px">Something went wrong while loading the app. Tap below to try again.</div>' +
            '<button id="flea-boot-retry" style="margin-top:8px;border:0;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:600;background:#2b2b2b;color:#ddfed7">Try again</button>' +
            '<div style="margin-top:10px;font-size:11px;opacity:.5;max-width:300px;word-break:break-word">' +
            (firstError ? String(firstError).slice(0, 300) : 'No error was reported.') +
            '</div>' +
            '</div>';
          var retry = document.getElementById('flea-boot-retry');
          if (retry) retry.addEventListener('click', function () { location.reload(); });
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
